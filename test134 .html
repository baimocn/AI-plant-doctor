<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>植物病害识别助手</title>
    <style>
        /* 样式保持不变，略... (为了节省篇幅，此处省略，实际应保留所有样式) */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f0f7ea; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; padding: 20px; padding-bottom: 40px; }
        .container { max-width: 650px; margin: 0 auto; }
        .card { background: white; border-radius: 32px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); padding: 24px 20px; margin-bottom: 20px; }
        h1 { font-size: 1.8rem; color: #1e4a1e; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .sub { color: #4a6741; border-left: 3px solid #7cb342; padding-left: 12px; margin-bottom: 24px; font-size: 0.9rem; }
        .upload-area { border: 2px dashed #b0d9b1; border-radius: 28px; padding: 32px 20px; text-align: center; background: #fefce8; cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
        .upload-area:hover { background: #f9f7e1; border-color: #7cb342; }
        .upload-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .file-input { display: none; }
        .preview-img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 24px; margin: 16px 0; background: #f9f9f9; display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        button { background: #2e7d32; color: white; border: none; font-size: 1.05rem; font-weight: 600; padding: 14px 24px; border-radius: 60px; width: 100%; cursor: pointer; transition: 0.2s; margin: 8px 0; }
        button:active { transform: scale(0.97); }
        button:disabled { background: #9e9e9e; cursor: not-allowed; transform: none; }
        .result-card { background: #eaf7ea; border-radius: 28px; padding: 20px; border-left: 6px solid #2e7d32; margin-top: 20px; }
        .result-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #2b5e2b; font-weight: 600; }
        .disease-name { font-size: 1.6rem; font-weight: 700; color: #1c3e1c; margin: 8px 0 12px; word-break: break-word; }
        .confidence-badge { background: white; display: inline-block; padding: 4px 14px; border-radius: 40px; font-size: 0.85rem; font-weight: 500; color: #2e7d32; margin-bottom: 16px; }
        .detail-section { border-top: 1px solid #c8e6c9; margin-top: 12px; padding-top: 16px; }
        .detail-item { margin-bottom: 16px; }
        .detail-label { font-weight: 700; color: #2c5e2c; font-size: 0.85rem; display: block; margin-bottom: 4px; }
        .detail-content { font-size: 0.95rem; line-height: 1.45; color: #1f3b1f; }
        .error-card { background: #ffe6e5; border-left-color: #d32f2f; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer { text-align: center; font-size: 0.7rem; color: #7b8a6b; margin-top: 20px; }
        .api-config { background: #f4f7f2; border-radius: 20px; padding: 12px 16px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .api-url { font-family: monospace; background: #e2e8e0; padding: 5px 10px; border-radius: 30px; word-break: break-all; flex: 1; font-size: 0.7rem; }
        .edit-btn { background: #a5b89c; padding: 6px 14px; width: auto; font-size: 0.7rem; margin: 0; }
        .edit-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🌿 病害识别助手</h1>
        <div class="sub">AI 精准识别 · 置信度评估 · 防治方案</div>

        <div class="api-config" id="apiConfig">
            <span>🔗 服务地址：</span>
            <span class="api-url" id="apiUrlDisplay">https://41fd146.r12.cpolar.top/</span>
            <button class="edit-btn" id="editApiBtn">修改</button>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <div>点击拍照或选择图片</div>
            <div style="font-size:0.7rem; color:#7f8c6d;">支持 JPG / PNG</div>
            <!-- 修复 input 标签 -->
            <input type="file" id="fileInput" accept="image/*" class="file-input">
        </div>

        <img id="preview" class="preview-img" alt="预览图片">
        <button id="predictBtn" disabled>🔍 开始识别</button>
        <div id="resultContainer"></div>
    </div>
    <div class="footer">
        🧪 基于 ResNet50 模型 · 134类病害 · 返回置信度及详细防治信息
    </div>
</div>

<script>
    let API_BASE_URL = 'https://41fd146.r12.cpolar.top/';
    const PREDICT_URL = () => `${API_BASE_URL}/predict`;

    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const previewImg = document.getElementById('preview');
    const predictBtn = document.getElementById('predictBtn');
    const resultContainer = document.getElementById('resultContainer');
    const apiUrlDisplay = document.getElementById('apiUrlDisplay');
    const editApiBtn = document.getElementById('editApiBtn');

    let selectedFile = null;

    function showMessage(text, isError = false) {
        resultContainer.innerHTML = `
            <div class="result-card ${isError ? 'error-card' : ''}">
                <div class="result-label">提示</div>
                <div class="disease-name" style="font-size:1.2rem;">${escapeHtml(text)}</div>
            </div>
        `;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function compressImage(file, maxWidthOrHeight = 1024, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    if (width > height && width > maxWidthOrHeight) {
                        height *= maxWidthOrHeight / width;
                        width = maxWidthOrHeight;
                    } else if (height > maxWidthOrHeight) {
                        width *= maxWidthOrHeight / height;
                        height = maxWidthOrHeight;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => {
                        const compressedFile = new File([blob], file.name, { type: 'image/jpeg' });
                        resolve(compressedFile);
                    }, 'image/jpeg', quality);
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
        });
    }

    function handleFile(file) {
        if (!file) return;
        selectedFile = file;
        const url = URL.createObjectURL(file);
        previewImg.src = url;
        previewImg.style.display = 'block';
        predictBtn.disabled = false;
        resultContainer.innerHTML = '';
    }

    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
    });
    uploadArea.addEventListener('click', () => fileInput.click());

    editApiBtn.addEventListener('click', () => {
        let newUrl = prompt('请输入后端基础地址（例如 https://xxxx.cpolar.top）', API_BASE_URL);
        if (newUrl) {
            newUrl = newUrl.replace(/\/$/, '');
            API_BASE_URL = newUrl;
            apiUrlDisplay.innerText = API_BASE_URL;
            showMessage(`后端地址已更新为 ${API_BASE_URL}`, false);
            resultContainer.innerHTML = '';
        }
    });

    predictBtn.addEventListener('click', async () => {
        if (!selectedFile) {
            alert('请先选择一张图片');
            return;
        }

        predictBtn.disabled = true;
        predictBtn.innerText = '⏳ 识别中...';
        resultContainer.innerHTML = `<div class="result-card"><div class="result-label">识别中</div><div style="padding:20px; text-align:center;">🔍 正在分析图片，请稍候...</div></div>`;

        try {
            let uploadFile = selectedFile;
            if (selectedFile.size > 200 * 1024) {
                try {
                    uploadFile = await compressImage(selectedFile);
                } catch (err) {
                    console.warn('压缩失败，使用原图', err);
                }
            }

            const formData = new FormData();
            formData.append('file', uploadFile);

            const response = await fetch(PREDICT_URL(), {
                method: 'POST',
                body: formData
            });
            if (!response.ok) {
                let errorText = await response.text();
                throw new Error(`接口错误 (${response.status}): ${errorText}`);
            }
            const data = await response.json();

            const predictionKey = data.prediction;
            const confidence = data.confidence;
            const diseaseInfo = data.disease_info || {};

            if (!predictionKey) {
                throw new Error('后端返回缺少 prediction 字段');
            }

            renderResult(predictionKey, confidence, diseaseInfo);
        } catch (err) {
            console.error(err);
            let errorMsg = err.message;
            if (errorMsg.includes('Failed to fetch')) {
                errorMsg = '无法连接后端服务，请检查：1) 服务地址是否正确 2) 队友的隧道是否已开启 3) 网络是否通畅';
            }
            showMessage(`请求失败：${errorMsg}`, true);
        } finally {
            predictBtn.disabled = false;
            predictBtn.innerText = '🔍 开始识别';
        }
    });

    function renderResult(predictionKey, confidence, info) {
        const displayName = (info && info.name) ? info.name : predictionKey.replace(/_/g, ' ');
        const confidencePercent = confidence !== undefined ? (confidence * 100).toFixed(1) : null;

        let html = `<div class="result-card">`;
        html += `<div class="result-label">识别结果</div>`;
        html += `<div class="disease-name">${escapeHtml(displayName)}</div>`;
        if (confidencePercent) {
            html += `<div class="confidence-badge">可信度: ${confidencePercent}%</div>`;
        } else {
            html += `<div class="confidence-badge">可信度: --</div>`;
        }

        html += `<div class="detail-section">`;
        let hasInfo = false;
        if (info && info.cause) {
            html += `<div class="detail-item"><span class="detail-label">🔬 病因</span><div class="detail-content">${escapeHtml(info.cause)}</div></div>`;
            hasInfo = true;
        }
        if (info && info.treatment) {
            html += `<div class="detail-item"><span class="detail-label">💊 防治方法</span><div class="detail-content">${escapeHtml(info.treatment)}</div></div>`;
            hasInfo = true;
        }
        if (info && info.observation) {
            html += `<div class="detail-item"><span class="detail-label">👀 观察重点</span><div class="detail-content">${escapeHtml(info.observation)}</div></div>`;
            hasInfo = true;
        }
        if (info && info.notes) {
            html += `<div class="detail-item"><span class="detail-label">📌 注意事项</span><div class="detail-content">${escapeHtml(info.notes)}</div></div>`;
            hasInfo = true;
        }
        if (!hasInfo) {
            html += `<div class="detail-item"><span class="detail-label">📭 暂无详细防治信息</span><div class="detail-content">请参考专业植保资料</div></div>`;
        }
        html += `</div>`;
        html += `</div>`;
        resultContainer.innerHTML = html;
    }

    apiUrlDisplay.innerText = API_BASE_URL;
    showMessage('请选择或拍摄叶片图片，AI 将为您诊断并给出置信度及防治建议', false);
</script>
</body>
</html>
